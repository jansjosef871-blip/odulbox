<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="monetag" content="7715ba8fc62264e1c986fed392996563">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OdulBox - Earn Rewards & Spin Online</title>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0f0c1b !important; color: #ffffff !important; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 0 160px; }
        header { width: 100%; max-width: 1200px; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #231d42; z-index: 10; }
        .logo { font-size: 24px; font-weight: 700; cursor: pointer; user-select: none; }
        .logo span { color: #ff3366; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .user-status { background: #1d183a; padding: 10px 20px; border-radius: 20px; font-weight: 600; border: 1px solid #ff3366; display: none; }
        .auth-trigger-btn { background: #ff3366; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 600; cursor: pointer; }
        .logout-btn { background: transparent; color: #a29bfe; border: 1px solid #231d42; padding: 10px 20px; border-radius: 20px; font-weight: 600; cursor: pointer; display: none; }
        .lang-selector { background: #1d183a; border: 1px solid #ff3366; color: white; padding: 5px 10px; border-radius: 15px; font-size: 13px; outline: none; cursor: pointer; }
        
        .container { text-align: center; padding: 20px 0 40px 0; max-width: 800px; width: 100%; }
        h1 { font-size: 32px; margin-bottom: 10px; color: white !important; }
        p { color: #a29bfe; margin-bottom: 30px; }
        
        .ad-banner { background: linear-gradient(135deg, #1d183a 0%, #110d26 100%); border: 1px dashed #4834d4; padding: 15px; border-radius: 10px; color: #ff3366; font-size: 13px; font-weight: 600; text-transform: uppercase; margin-bottom: 25px; text-align: center; width: 100%; overflow: hidden; display: flex; justify-content: center; align-items: center; min-height: 90px; }
        .ad-banner img, .ad-sidebar img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
        .ad-top { max-width: 728px; margin: 10px auto 25px auto; }
        .ad-middle { max-width: 500px; margin: 20px auto; }
        
        .ad-sidebar { position: fixed; top: 100px; width: 140px; height: 600px; background: linear-gradient(180deg, #1d183a 0%, #0f0c1b 100%); border: 1px dashed #ff3366; color: #a29bfe; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; text-orientation: mixed; font-weight: bold; border-radius: 8px; overflow: hidden; }
        .ad-left { left: 10px; } .ad-right { right: 10px; }

        .mega-box-container { background: #1d183a; border: 2px solid #ff3366; border-radius: 15px; padding: 30px; margin: 20px auto; max-width: 500px; box-shadow: 0 0 30px rgba(255, 51, 102, 0.2); text-align: center; }
        .gift-box-icon { font-size: 60px; margin-bottom: 15px; }
        .mega-spin-link-btn { display: block; width: 100%; background: #ff3366; color: white; border: none; padding: 12px 25px; border-radius: 30px; font-weight: 700; font-size: 15px; text-transform: uppercase; cursor: pointer; }
        .mega-spin-link-btn:hover { background: #e02454; }

        .tasks-rewards-section { display: flex; gap: 20px; margin-top: 30px; text-align: left; width: 100%; }
        .info-box { flex: 1; background: #1d183a; border: 1px solid #231d42; padding: 20px; border-radius: 12px; }
        .info-box h3 { font-size: 18px; margin-bottom: 15px; color: #ffffff; border-bottom: 2px solid #ff3366; padding-bottom: 5px; display: inline-block; }
        
        .task-item, .reward-item { display: flex; justify-content: space-between; align-items: center; background: #0f0c1b; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #231d42; }
        .task-info { display: flex; align-items: center; gap: 10px; }
        .task-info p { margin: 0; color: white; font-size: 14px; font-weight: 600; }
        .task-icon { font-size: 20px; }
        .task-reward-amount { font-size: 12px; color: #2ecc71; font-weight: bold; }
        .task-link-button, .withdraw-btn { background: #ff3366; color: white; border: none; padding: 6px 15px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; text-align: center; }
        .task-link-button:hover, .withdraw-btn:hover { background: #e02454; }

        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(15, 12, 27, 0.8); backdrop-filter: blur(8px); align-items: center; justify-content: center; }
        .modal-content { background-color: #1d183a; padding: 30px; border: 1px solid #231d42; width: 95%; max-width: 500px; border-radius: 15px; position: relative; box-shadow: 0 0 25px rgba(255, 51, 102, 0.2); max-height: 85vh; overflow-y: auto; }
        .close-btn { position: absolute; right: 20px; top: 15px; color: #a29bfe; font-size: 28px; cursor: pointer; }
        .modal h2 { margin-bottom: 15px; font-size: 20px; color: white; text-align: center; border-bottom: 1px solid #231d42; padding-bottom: 10px; }
        .modal input, .modal select { width: 100%; padding: 10px 12px; margin-bottom: 10px; background: #0f0c1b; border: 1px solid #231d42; border-radius: 8px; color: white; font-size: 13px; outline: none; }
        .form-submit-btn { width: 100%; padding: 10px; background: #ff3366; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 5px; }
        .admin-section-title { text-align: left; font-size: 14px; color: #ff3366; font-weight: bold; margin: 15px 0 8px 0; border-left: 3px solid #ff3366; padding-left: 8px; }
        .switch-form-txt { margin-top: 15px; font-size: 12px; color: #a29bfe; text-align: center; }
        .switch-form-txt a { color: #ff3366; text-decoration: none; font-weight: 600; }
        
        .request-list-item { background: #0f0c1b; border: 1px solid #231d42; border-radius: 6px; padding: 10px; margin-bottom: 8px; text-align: left; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
        .delete-req-btn { background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }

        @media (max-width: 1100px) { body { padding: 0 20px; } .ad-sidebar { display: none; } }
        @media (max-width: 600px) { .tasks-rewards-section { flex-direction: column; } }
    </style>
</head>
<body>

    <!-- Reklam Alanları -->
    <div id="ad-left-area" class="ad-sidebar ad-left">[🔥 REKLAM]</div>
    <div id="ad-right-area" class="ad-sidebar ad-right">[🔥 REKLAM]</div>

    <header>
        <div id="site-logo" class="logo">🎁 Odul<span>Box</span></div>
        <div class="header-right">
            <!-- DÜNYA DİLLERİ SEÇİM KUTUSU (TR/EN/DE) -->
            <select id="site-lang-select" class="lang-selector">
                <option value="tr">🇹🇷 TR</option>
                <option value="en">🇺🇸 EN</option>
                <option value="de">🇩🇪 DE</option>
            </select>
            <span id="txt-balance" class="user-status">Bakiye: 0.00 $</span>
            <button id="auth-nav-btn" class="auth-trigger-btn">Giriş Yap / Kayıt Ol</button>
            <button id="logout-btn" class="logout-btn">Çıkış Yap</button>
        </div>
    </header>

    <main class="container">
        <div id="ad-top-area" class="ad-banner ad-top">[TOP AD BANNER]</div>
        <h1 id="txt-welcome">OdulBox'a Hoş Geldiniz!</h1>
        <p id="txt-subtitle">Görevleri tamamlayın, şans kutusunu açın ve gerçek dolar ödülleri kazanın!</p>

        <div class="mega-box-container">
            <div class="gift-box-icon">🎁</div>
            <button id="btn-spin" class="mega-spin-link-btn">ŞANS KUTUSUNU AÇ VE KAZAN!</button>
        </div>

        <div id="ad-mid-area" class="ad-banner ad-middle">[NATIVE AD]</div>

        <section class="tasks-rewards-section">
            <div class="info-box">
                <h3 id="txt-tasks-title">Günlük Görevler</h3>
                <div id="tasks-list-container"></div>
            </div>

            <div class="info-box">
                <h3 id="txt-rewards-title">Ödülünü Çek</h3>
                <div id="rewards-list-container"></div>
            </div>
        </section>
    </main>

    <!-- AUTH GİRİŞ KAYIT MODAL -->
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <span id="close-auth-btn" class="close-btn">&times;</span>
            
            <div id="login-form-box">
                <h2 id="modal-login-title">Hesaba Giriş Yap</h2>
                <form id="login-form">
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-password" placeholder="Şifre" required>
                    <button type="submit" class="form-submit-btn" id="modal-login-btn">Giriş Yap</button>
                </form>
                <p class="switch-form-txt"><span id="modal-no-acc">Hesabınız yok mu?</span> <a href="#" id="go-to-register">Kayıt Ol</a></p>
            </div>

            <div id="register-form-box" style="display: none;">
                <h2>Hesap Oluştur</h2>
                <form id="register-form">
                    <input type="text" id="reg-username" placeholder="Kullanıcı Adı" required>
                    <input type="email" id="reg-email" placeholder="Email" required>
                    <input type="password" id="reg-password" placeholder="Şifre" required>
